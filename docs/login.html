<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello Page - 登录</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
        }
        .container {
            text-align: center;
            padding: 40px;
            background: rgba(255,255,255,0.1);
            border-radius: 16px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            width: 320px;
        }
        h1 { font-size: 2.2em; margin-bottom: 10px; }
        p  { font-size: 1.1em; opacity: 0.9; }

        /* ===== 登录表单样式 ===== */
        .login-form {
            margin-top: 25px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .form-group {
            text-align: left;
        }
        .form-group label {
            display: block;
            font-size: 0.9em;
            margin-bottom: 6px;
            opacity: 0.85;
        }
        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 8px;
            background: rgba(255,255,255,0.15);
            color: #fff;
            font-size: 1em;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.3s, background 0.3s;
        }
        .form-group input::placeholder {
            color: rgba(255,255,255,0.5);
        }
        .form-group input:focus {
            border-color: rgba(255,255,255,0.8);
            background: rgba(255,255,255,0.25);
        }
        .login-btn {
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: rgba(255,255,255,0.9);
            color: #764ba2;
            font-size: 1.05em;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, background 0.3s;
        }
        .login-btn:hover {
            background: #fff;
            transform: translateY(-2px);
        }
        .login-btn:active {
            transform: translateY(0);
        }

        /* ===== 自定义对话框样式 ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal-box {
            background: rgba(255,255,255,0.95);
            color: #333;
            padding: 30px 40px;
            border-radius: 12px;
            text-align: center;
            max-width: 320px;
            animation: popIn 0.25s ease-out;
        }
        .modal-box h3 {
            margin: 0 0 12px;
            font-size: 1.3em;
        }
        .modal-box p {
            color: #555;
            opacity: 1;
            margin: 0 0 20px;
        }
        .modal-box button {
            padding: 8px 28px;
            border: none;
            border-radius: 6px;
            background: #764ba2;
            color: #fff;
            font-size: 1em;
            cursor: pointer;
        }
        .modal-box button:hover {
            background: #667eea;
        }
        @keyframes popIn {
            from { transform: scale(0.8); opacity: 0; }
            to   { transform: scale(1);   opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎉 欢迎访问</h1>
        <p>这是一个由 Go 语言驱动的 HTTP 服务器</p>
        <p>当前监听端口：<strong>8081</strong></p>

        <!-- ===== 登录表单 ===== -->
        <form class="login-form" id="loginForm">
            <div class="form-group">
                <label for="username">用户名</label>
                <input type="text" id="username" placeholder="请输入用户名" autocomplete="username">
            </div>
            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" placeholder="请输入密码" autocomplete="current-password">
            </div>
            <button type="submit" class="login-btn" id="loginBtn">登 录</button>
        </form>
    </div>

    <!-- ===== 自定义对话框 ===== -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box">
            <h3 id="modalTitle">提示</h3>
            <p id="modalMessage">内容</p>
            <button id="modalCloseBtn">确 定</button>
        </div>
    </div>

    <!-- 引入外部 JS -->
    <script src="login.js"></script>
</body>
</html>
